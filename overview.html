<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台概览 · 东盟跨境灾害心理干预应急语言服务平台</title>
<style>
  :root{
    --bg:#f2f5fa;--card:#ffffff;--text:#0f172a;--muted:#64748b;--line:#e5eaf2;
    --primary:#2563eb;--primary-dark:#1d4ed8;--primary-soft:#eff5ff;--radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Inter","Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans Thai",sans-serif;
    font-size:14px;line-height:1.6;padding:20px 22px 28px;min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;}
  a{color:inherit;}

  .hero{
    position:relative;overflow:hidden;border-radius:18px;
    background:linear-gradient(120deg,#0a2140 0%,#123a6e 42%,#1d4ed8 82%,#2563eb 100%);
    color:#fff;padding:28px 32px;margin-bottom:16px;box-shadow:0 14px 34px rgba(20,55,110,.24);
  }
  .hero::before{
    content:"";position:absolute;left:-90px;bottom:-120px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(6,182,212,.26),transparent 68%);
  }
  .hero::after{
    content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;
    border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.32),transparent 68%);
  }
  .hero-art{position:absolute;right:26px;bottom:-14px;width:220px;opacity:.22;pointer-events:none;}
  .hero-content{position:relative;z-index:2;max-width:760px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;
    letter-spacing:1.1px;text-transform:uppercase;color:#bfdbfe;background:rgba(255,255,255,.10);
    border:1px solid rgba(191,219,254,.22);padding:4px 10px;border-radius:999px;margin-bottom:11px;
  }
  .eyebrow .pulse{width:5px;height:5px;border-radius:50%;background:#67e8f9;animation:pulseDot 2s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(103,232,249,.55);}50%{box-shadow:0 0 0 5px rgba(103,232,249,0);}}
  .hero h1{margin:0 0 9px;font-size:24px;font-weight:700;letter-spacing:.2px;line-height:1.4;position:relative;z-index:1;
    background:linear-gradient(110deg,#fff 40%,#a5d8ff 50%,#fff 60%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:shine 6s linear infinite;
  }
  @keyframes shine{0%{background-position:120% 0;}100%{background-position:-120% 0;}}
  .hero p{margin:0;font-size:13px;line-height:1.85;color:#cfe0f6;max-width:700px;}
  .hero-actions{display:flex;align-items:center;gap:10px;margin-top:17px;flex-wrap:wrap;}
  .btn{
    height:37px;padding:0 15px;border-radius:9px;border:1px solid transparent;
    font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    text-decoration:none;white-space:nowrap;transition:all .15s;
  }
  .btn-white{background:#fff;color:#1d4ed8;box-shadow:0 4px 12px rgba(2,20,50,.16);}
  .btn-white:hover{background:#f0f6ff;}
  .btn-ghost{background:rgba(255,255,255,.08);color:#e2eeff;border-color:rgba(191,219,254,.26);}
  .btn-ghost:hover{background:rgba(255,255,255,.15);}
  .hero-domains{display:flex;align-items:center;gap:7px;margin-top:16px;flex-wrap:wrap;font-size:10.5px;color:#9fc3ea;}
  .hero-domains span{
    padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);color:#d6e6fa;letter-spacing:.2px;
  }

  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:0 1px 3px rgba(15,23,42,.05);
    display:flex;align-items:center;gap:11px;min-width:0;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .stat:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.10);border-color:#d7e3f6;}
  .stat-icon{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;}
  .stat-icon.blue{background:#e8f0fe;color:#1d4ed8;}
  .stat-icon.violet{background:#f3e8ff;color:#7e22ce;}
  .stat-icon.teal{background:#ccfbf1;color:#0f766e;}
  .stat-icon.amber{background:#fffbeb;color:#b45309;}
  .stat-icon.rose{background:#ffe4e6;color:#be123c;}
  .stat-body{min-width:0;}
  .stat-label{font-size:11.4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-value{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:.2px;font-variant-numeric:tabular-nums;}
  .stat-sub{font-size:10.2px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 10px;}
  .section-head h2{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .section-head span{font-size:11.5px;color:#94a3b8;}
  .demo-tag{
    font-size:9.5px;font-weight:600;color:#b45309;background:#fffbeb;
    border:1px solid #fde68a;border-radius:999px;padding:1px 8px;line-height:1.7;white-space:nowrap;
  }

  .modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .module{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 17px 14px;box-shadow:0 1px 3px rgba(15,23,42,.05);
    display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .18s,box-shadow .18s,transform .18s;
  }
  .module::before{
    content:"";position:absolute;left:0;top:0;right:0;height:3px;
    background:linear-gradient(90deg,#2563eb,#06b6d4);
    opacity:0;transform:scaleX(.4);transform-origin:left;transition:opacity .2s,transform .25s ease;
  }
  .module:hover{border-color:#c7d9f5;box-shadow:0 12px 28px rgba(15,23,42,.11);transform:translateY(-3px);}
  .module:hover::before{opacity:1;transform:scaleX(1);}
  .module-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .module-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;}
  .module-icon.blue{background:#e8f0fe;color:#1d4ed8;}
  .module-icon.violet{background:#f3e8ff;color:#7e22ce;}
  .module-icon.teal{background:#ccfbf1;color:#0f766e;}
  .module-icon.amber{background:#fffbeb;color:#b45309;}
  .module-icon.rose{background:#ffe4e6;color:#be123c;}
  .module-icon.slate{background:#eef2f7;color:#475569;}
  .module-index{font-size:10.5px;font-weight:700;color:#cbd5e1;letter-spacing:.5px;}
  .module h3{margin:2px 0 0;font-size:14.5px;font-weight:700;line-height:1.45;}
  .module p{margin:0;font-size:12.1px;color:#64748b;line-height:1.72;min-height:60px;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:10px;color:#64748b;background:#f5f8fc;border:1px solid #eef2f8;border-radius:5px;padding:1px 7px;white-space:nowrap;}
  .module-foot{margin-top:auto;padding-top:9px;border-top:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .module-foot .hint{font-size:10.5px;color:#94a3b8;}
  .enter{font-size:12px;font-weight:600;color:var(--primary);display:inline-flex;align-items:center;gap:4px;}
  .module:hover .enter{color:var(--primary-dark);}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden;min-width:0;}
  .panel-head{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-head h2{margin:0;font-size:14px;font-weight:700;}
  .panel-head .meta{font-size:10.8px;color:#94a3b8;white-space:nowrap;}
  .two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;margin-bottom:14px;}

  .status-list{padding:6px 17px 12px;}
  .status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #eef2f8;}
  .status-row:last-child{border-bottom:none;}
  .status-key{font-size:12.2px;color:#64748b;display:flex;align-items:center;gap:7px;}
  .status-key .dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1;flex:none;}
  .status-key .dot.green{background:#10b981;}
  .status-key .dot.amber{background:#f59e0b;}
  .status-key .dot.red{background:#f43f5e;}
  .status-val{font-size:12px;font-weight:600;color:#334155;text-align:right;overflow:hidden;text-overflow:ellipsis;max-width:62%;}
  .status-val.muted{color:#94a3b8;font-weight:500;}

  .dist-list{padding:15px 17px 17px;display:flex;flex-direction:column;gap:13px;}
  .dist-item{display:flex;flex-direction:column;gap:5px;}
  .dist-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.8px;}
  .dist-name{color:#475569;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dist-num{color:#94a3b8;font-variant-numeric:tabular-nums;flex:none;}
  .bar{height:6px;border-radius:3px;background:#eef2f8;overflow:hidden;}
  .bar span{display:block;height:100%;border-radius:3px;}
  .bar .b1{background:linear-gradient(90deg,#60a5fa,#2563eb);}
  .bar .b2{background:linear-gradient(90deg,#c084fc,#9333ea);}
  .bar .b3{background:linear-gradient(90deg,#5eead4,#0d9488);}
  .bar .b4{background:linear-gradient(90deg,#fcd34d,#d97706);}

  .news-list{padding:4px 17px 12px;}
  .news-item{display:flex;align-items:flex-start;gap:13px;padding:11px 0;border-bottom:1px dashed #eef2f8;cursor:pointer;}
  .news-item:last-child{border-bottom:none;}
  .news-item:hover .news-title{color:var(--primary);}
  .news-date{width:92px;flex:none;font-size:11px;color:#94a3b8;font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.5;}
  .news-main{min-width:0;flex:1;}
  .news-title{font-size:12.5px;font-weight:600;color:#334155;line-height:1.6;word-break:break-word;transition:color .15s;}
  .news-meta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap;}
  .kw{font-size:9.8px;font-weight:600;border-radius:999px;padding:1px 7px;line-height:1.7;}
  .kw.INSARAG{background:#e8f0fe;color:#1d4ed8;}
  .kw.PFA{background:#f3e8ff;color:#7e22ce;}
  .kw.CROSS{background:#ccfbf1;color:#0f766e;}
  .kw.OTHER{background:#eef2f7;color:#475569;}
  .news-src{font-size:10px;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty{padding:26px 0;text-align:center;font-size:12px;color:#94a3b8;}

  .footnote{margin-top:14px;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 4px;}

  @media (max-width:1160px){
    .stats{grid-template-columns:repeat(3,minmax(0,1fr));}
    .modules{grid-template-columns:repeat(2,minmax(0,1fr));}
    .module p{min-height:0;}
  }
  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
    .modules{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .hero-art{display:none;}
  }
  @media (max-width:600px){
    body{padding:16px;}
    .stats{grid-template-columns:1fr;}
    .hero{padding:22px 20px;}
    .hero h1{font-size:20px;}
  }
</style>
</head>
<body>
<script src="assets/api-config.js"></script>
<script src="assets/static-api.js"></script>
<div class="wrap">

  <section class="hero">
    <svg class="hero-art" viewBox="0 0 240 200" fill="none" stroke="#bfdbfe" stroke-width="1.1">
      <circle cx="138" cy="92" r="74"/>
      <ellipse cx="138" cy="92" rx="74" ry="30"/>
      <ellipse cx="138" cy="92" rx="30" ry="74"/>
      <path d="M64 92h148M78 56c30 22 90 22 120 0M78 128c30-22 90-22 120 0"/>
      <circle cx="83" cy="62" r="3.5" fill="#93c5fd" stroke="none"/>
      <circle cx="186" cy="117" r="3.5" fill="#93c5fd" stroke="none"/>
      <circle cx="138" cy="30" r="3.5" fill="#93c5fd" stroke="none"/>
      <circle cx="112" cy="146" r="3.5" fill="#93c5fd" stroke="none"/>
    </svg>
    <div class="hero-content">
      <div class="eyebrow"><span class="pulse"></span><span data-i18n="eyebrow"></span></div>
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroDesc"></p>
      <div class="hero-actions">
        <button class="btn btn-white" data-go="foreign"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span data-i18n="btnForeign"></span></button>
        <button class="btn btn-ghost" data-go="translate"><span data-i18n="btnTranslate"></span> →</button>
        <button class="btn btn-ghost" data-go="rag"><span data-i18n="btnRag"></span> →</button>
      </div>
      <div class="hero-domains">
        <span>OCHA</span><span>ReliefWeb</span><span>UN News</span>
        <span>INSARAG</span><span>PFA</span>
        <span data-i18n="heroLangs"></span>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stat">
      <div class="stat-icon blue">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-label" data-i18n="statTerms"></div>
        <div class="stat-value" id="statTerms">—</div>
        <div class="stat-sub" data-i18n="statTermsSub"></div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon violet">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h7v13H4z"/><path d="M13 6h7v13h-7z"/><path d="M6.5 9.5h2M6.5 13h2M15.5 9.5h2M15.5 13h2"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-label" data-i18n="statParallel"></div>
        <div class="stat-value" id="statParallel">—</div>
        <div class="stat-sub" data-i18n="statParallelSub"></div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon teal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-label" data-i18n="statForeign"></div>
        <div class="stat-value" id="statForeign">—</div>
        <div class="stat-sub" data-i18n="statForeignSub"></div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon amber">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-label" data-i18n="statChunks"></div>
        <div class="stat-value" id="statChunks">—</div>
        <div class="stat-sub" data-i18n="statChunksSub"></div>
      </div>
    </div>
    <div class="stat">
      <div class="stat-icon rose">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
      </div>
      <div class="stat-body">
        <div class="stat-label" data-i18n="statRag"></div>
        <div class="stat-value" id="statRag">—</div>
        <div class="stat-sub" data-i18n="statRagSub"></div>
      </div>
    </div>
  </section>

  <div class="section-head">
    <h2><span data-i18n="modulesTitle"></span><span class="demo-tag" data-i18n="demoTag"></span></h2>
    <span data-i18n="modulesSub"></span>
  </div>

  <section class="modules" id="moduleGrid"></section>

  <div class="two-col">
    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="statusTitle"></h2>
        <span class="meta" id="statusMeta"></span>
      </div>
      <div class="status-list">
        <div class="status-row">
          <span class="status-key"><span class="dot" id="dotEmbed"></span><span data-i18n="statusEmbed"></span></span>
          <span class="status-val muted" id="statusEmbed">…</span>
        </div>
        <div class="status-row">
          <span class="status-key"><span class="dot" id="dotLLM"></span><span data-i18n="statusLLM"></span></span>
          <span class="status-val muted" id="statusLLM">…</span>
        </div>
        <div class="status-row">
          <span class="status-key"><span class="dot" id="dotIndex"></span><span data-i18n="statusIndex"></span></span>
          <span class="status-val muted" id="statusIndex">…</span>
        </div>
        <div class="status-row">
          <span class="status-key"><span class="dot" id="dotParallel"></span><span data-i18n="statusParallelIndex"></span></span>
          <span class="status-val muted" id="statusParallelIndex">…</span>
        </div>
        <div class="status-row">
          <span class="status-key"><span class="dot" id="dotMode"></span><span data-i18n="statusMode"></span></span>
          <span class="status-val muted" id="statusMode">…</span>
        </div>
        <div class="status-row">
          <span class="status-key"><span class="dot green"></span><span data-i18n="statusCoverage"></span></span>
          <span class="status-val" id="statusCoverage">—</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="dataTitle"></h2>
        <span class="meta" id="dataMeta"></span>
      </div>
      <div class="dist-list" id="distList"></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="recentTitle"></h2>
      <span class="meta" data-i18n="recentNote"></span>
    </div>
    <div class="news-list" id="newsList"><div class="empty">…</div></div>
  </section>

  <div class="footnote">
    <span data-i18n="footLeft"></span>
    <span data-i18n="footRight"></span>
  </div>
</div>

<script>
(function () {
  "use strict";

  if (new URLSearchParams(location.search).get("embed") === "1") {
    document.body.classList.add("embed");
  }

  var LANG_KEY = "kb_lang";
  var CODES = ["zh", "en", "th", "vi", "ms"];
  var RAG_BASE = 18;

  var I18N = {
    zh: {
      eyebrow: "TASK 12 · 应急语言服务平台",
      heroTitle: "东盟跨境灾害心理干预应急语言服务平台",
      heroDesc: "以灾后心理干预为主线，面向东盟跨境灾害场景整合 PFA 心理急救、MHPSS 心理与社会支持、创伤应激干预、哀伤辅导、儿童与家庭心理支持、救援人员心理关怀六类知识，配套外语资讯聚合、多语种翻译、术语库、平行语料库、新闻 CMS 与可追溯 RAG 问答，支持中、英、泰、越、马来五语协同。",
      btnForeign: "浏览外语资讯",
      btnTranslate: "进入多语种翻译",
      btnRag: "RAG 智能问答",
      heroLangs: "中 / 英 / 泰 / 越 / 马来",
      demoTag: "演示模拟数据",

  var MODULES = [

    { view: "parallel", color: "amber", key: "m4", icon: '<path d="M4 6h7v13H4z"/><path d="M13 6h7v13h-7z"/><path d="M6.5 9.5h2M6.5 13h2M15.5 9.5h2M15.5 13h2"/>' },

  ];

  var lang = (function () {
    try {
      var v = localStorage.getItem(LANG_KEY);
      return CODES.indexOf(v) >= 0 ? v : "zh";
    } catch (e) { return "zh"; }
  })();

  var statusInfo = null;
  var counts = { news: 0, foreign: 0, glossary: 0, parallel: 0, chunks: 0 };
  var foreignItems = [];

  function t(key) {
    var dict = I18N[lang] || I18N.zh;
    return dict[key] != null ? dict[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
  }
  function fmt(key, map) {
    var text = t(key);
    Object.keys(map || {}).forEach(function (k) {
      text = text.replace(new RegExp("\\{" + k + "\\}", "g"), map[k]);
    });
    return text;
  }
  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch (e) { return url || ""; }
  }
  function setText(id, value) {
    var el = document.getElementById(id);
    if (el) el.textContent = value;
  }
  function setDot(id, color) {
    var el = document.getElementById(id);
    if (el) el.className = "dot " + color;
  }

  function renderModules() {
    document.getElementById("moduleGrid").innerHTML = MODULES.map(function (m, i) {
      return (
        '<article class="module" data-go="' + m.view + '">' +
          '<div class="module-top">' +
            '<div class="module-icon ' + m.color + '">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + m.icon + "</svg>" +
            "</div>" +
            '<span class="module-index">0' + (i + 1) + "</span>" +
          "</div>" +
          "<h3>" + escapeHtml(t(m.key + "Title")) + "</h3>" +
          "<p>" + escapeHtml(t(m.key + "Desc")) + "</p>" +
          '<div class="tags"><span class="tag">' + escapeHtml(t(m.key + "Tag1")) + '</span><span class="tag">' + escapeHtml(t(m.key + "Tag2")) + "</span></div>" +
          '<div class="module-foot"><span class="hint">' + escapeHtml(t(m.key + "Hint")) + "</span>" +
          '<span class="enter">' + escapeHtml(t("enterModule")) + " →</span></div>" +
        "</article>"
      );
    }).join("");
  }

  function renderStats() {
    setText("statTerms", counts.glossary || "—");
    setText("statParallel", counts.parallel || "—");
    setText("statForeign", counts.foreign || "—");
    setText("statChunks", (statusInfo && statusInfo.chunk_count) || counts.chunks || "—");
  }

  function renderStatus() {
    var metaEl = document.getElementById("statusMeta");
    if (!statusInfo) {
      setText("statusEmbed", t("notConnected"));
      setText("statusLLM", t("notConnected"));
      setText("statusIndex", t("notConnected"));
      setText("statusParallelIndex", t("notConnected"));
      setText("statusMode", t("notConnected"));
      setText("statusCoverage", "—");
      ["statusEmbed", "statusLLM", "statusIndex", "statusParallelIndex", "statusMode"].forEach(function (id) {
        document.getElementById(id).classList.add("muted");
      });
      setDot("dotEmbed", "red"); setDot("dotLLM", "red"); setDot("dotIndex", "red");
      setDot("dotParallel", "red"); setDot("dotMode", "red");
      if (metaEl) metaEl.textContent = t("statusMetaOffline");
      return;
    }
    var info = statusInfo;
    var embedOnline = info.embedding_mode === "bigmodel";
    var llmOnline = info.llm_mode === "deepseek";
    var online = embedOnline && llmOnline;

    setText("statusEmbed", embedOnline ? info.embedding_model : t("localEmbed"));
    setText("statusLLM", llmOnline ? info.llm_model : t("localLLM"));
    setText("statusIndex", info.index_ready ? fmt("indexReady", { n: info.dim || 0 }) : t("pending"));
    setText("statusParallelIndex", info.parallel_index_ready
      ? fmt("parallelReady", { n: info.parallel_count || 0, d: info.parallel_dim || 0 })
      : t("pending"));
    setText("statusMode", online ? t("onlineMode") : t("demoMode"));
    setText("statusCoverage", fmt("coverageValue", {
      a: info.news_count || 0, b: info.foreign_count || 0,
      c: info.glossary_count || 0, d: info.parallel_count || 0
    }));
    ["statusEmbed", "statusLLM", "statusIndex", "statusParallelIndex", "statusMode"].forEach(function (id) {
      document.getElementById(id).classList.remove("muted");
    });
    setDot("dotEmbed", embedOnline ? "green" : "amber");
    setDot("dotLLM", llmOnline ? "green" : "amber");
    setDot("dotIndex", info.index_ready ? "green" : "amber");
    setDot("dotParallel", info.parallel_index_ready ? "green" : "amber");
    setDot("dotMode", online ? "green" : "amber");
    if (metaEl) metaEl.textContent = fmt("statusMetaReady", { t: online ? t("onlineMode") : t("demoMode") });
  }

  function renderDataScale() {
    var rows = [
      { key: "dataTerms", value: counts.glossary, cls: "b1" },
      { key: "dataParallel", value: counts.parallel, cls: "b2" },
      { key: "dataForeign", value: counts.foreign, cls: "b3" },
      { key: "dataNews", value: counts.news, cls: "b4" }
    ];
    var max = 1;
    rows.forEach(function (r) { if (r.value > max) max = r.value; });
    document.getElementById("dataMeta").textContent = t("dataMeta");
    document.getElementById("distList").innerHTML = rows.map(function (r) {
      var pct = r.value ? Math.max(6, Math.round((r.value / max) * 100)) : 0;
      return (
        '<div class="dist-item">' +
          '<div class="dist-top"><span class="dist-name">' + escapeHtml(t(r.key)) + "</span>" +
          '<span class="dist-num">' + (r.value || "—") + "</span></div>" +
          '<div class="bar"><span class="' + r.cls + '" style="width:' + pct + '%"></span></div>' +
        "</div>"
      );
    }).join("");
  }

  function summaryOf(item) {
    if (lang === "zh") return item.summary_zh || item.summary_en || "";
    return item.summary_en || item.summary_zh || "";
  }

  function renderRecent() {
    var list = foreignItems.slice().sort(function (a, b) {
      return String(b.translated_at || "").localeCompare(String(a.translated_at || ""));
    }).slice(0, 5);
    var box = document.getElementById("newsList");
    if (!list.length) {
      box.innerHTML = '<div class="empty">' + escapeHtml(t("recentEmpty")) + "</div>";
      return;
    }
    box.innerHTML = list.map(function (item) {
      return (
        '<div class="news-item" data-url="' + escapeHtml(item.url || "") + '">' +
          '<div class="news-date">' + escapeHtml(item.translated_at || item.publish_date || "—") + "</div>" +
          '<div class="news-main">' +
            '<div class="news-title">' + escapeHtml(item.title_zh || "") + "</div>" +
            '<div class="news-meta">' +
              '<span class="kw OTHER">' + escapeHtml(item.source_name || item.source_code || "") + "</span>" +
              '<span class="news-src">' + escapeHtml(item.country || "") + " · " + escapeHtml(item.category || "") + " · " + escapeHtml(hostOf(item.url)) + "</span>" +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll(".news-item"), function (el) {
      el.addEventListener("click", function () {
        var url = el.getAttribute("data-url");
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });
    });
  }

  function applyLang(next) {
    lang = CODES.indexOf(next) >= 0 ? next : "zh";
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.title = t("heroTitle") + " · " + t("modulesTitle");

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    renderModules();
    renderStatus();
    renderRecent();
    renderDataScale();
  }

  function go(view) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "navigate", view: view }, "*");
    } else {
      location.href = "index.html#/" + view;
    }
  }

  function readRagCount() {
    try {
      var raw = localStorage.getItem("rag_qa_count");
      var value = raw === null ? NaN : parseInt(raw, 10);
      if (isNaN(value) || value < 0) {
        value = RAG_BASE;
        localStorage.setItem("rag_qa_count", String(value));
      }
      return value;
    } catch (e) { return RAG_BASE; }
  }

  function loadData() {
    function getJson(url, onOk) {
      fetch(url, { cache: "no-store" })
        .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
        .then(onOk)
        .catch(function () {});
    }
    getJson("glossary.json", function (data) {
      counts.glossary = Array.isArray(data) ? data.length : 0;
      renderStats(); renderDataScale();
    });
    getJson("parallel.json", function (data) {
      counts.parallel = Array.isArray(data) ? data.length : 0;
      renderStats(); renderDataScale();
    });
    getJson("foreign_news.json", function (data) {
      foreignItems = Array.isArray(data) ? data : [];
      counts.foreign = foreignItems.length;
      renderStats(); renderDataScale(); renderRecent();
    });
    getJson("insarag_news.json", function (data) {
      counts.news = Array.isArray(data) ? data.length : 0;
      renderDataScale();
    });
    fetch("/api/status", { cache: "no-store" })
      .then(function (res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
      .then(function (info) {
        statusInfo = info;
        counts.news = info.news_count || counts.news;
        counts.foreign = info.foreign_count || counts.foreign;
        counts.glossary = info.glossary_count || counts.glossary;
        counts.parallel = info.parallel_count || counts.parallel;
        counts.chunks = info.chunk_count || 0;
        renderStats(); renderStatus(); renderDataScale();
      })
      .catch(function () {
        statusInfo = null;
        renderStatus();
      });
  }

  document.addEventListener("click", function (e) {
    var target = e.target.closest("[data-go]");
    if (target) go(target.getAttribute("data-go"));
  });

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "setLang" && CODES.indexOf(e.data.lang) >= 0 && e.data.lang !== lang) {
      applyLang(e.data.lang);
    }
  });
  window.addEventListener("storage", function (e) {
    if (e.key === LANG_KEY && e.newValue && CODES.indexOf(e.newValue) >= 0 && e.newValue !== lang) {
      applyLang(e.newValue);
    }
    if (e.key === "rag_qa_count") setText("statRag", readRagCount());
  });

  setText("statRag", readRagCount());
  applyLang(lang);
  loadData();
})();
