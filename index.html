<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东盟跨境灾害心理干预应急语言服务平台</title>
<style>
  :root{
    --bg:#f2f5fa;
    --card:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --line:#e5eaf2;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --primary-soft:#eff5ff;
    --sidebar-w:252px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter","Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans Thai",sans-serif;
    font-size:14px;line-height:1.6;
  }
  .app{display:flex;height:100vh;width:100%;}

  /* ================= Sidebar ================= */
  .sidebar{
    width:var(--sidebar-w);flex:none;height:100%;
    background:linear-gradient(180deg,#081c38 0%,#0d2d55 45%,#0a2342 78%,#0b2749 100%);
    color:#fff;display:flex;flex-direction:column;
    padding:18px 13px 12px;position:relative;z-index:30;
    box-shadow:4px 0 24px rgba(10,35,66,.22);
    overflow-y:auto;overflow-x:hidden;
  }
  .sidebar::before{
    content:"";position:absolute;left:-90px;top:-90px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,130,246,.22),transparent 68%);pointer-events:none;
  }
  .sidebar::after{
    content:"";position:absolute;right:-120px;bottom:-60px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(6,182,212,.14),transparent 70%);pointer-events:none;
  }
  .sidebar::-webkit-scrollbar{width:0;}
  .brand{display:flex;align-items:flex-start;gap:10px;padding:2px 8px 14px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,#3b82f6,#06b6d4);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.28);
    animation:brandGlow 4.5s ease-in-out infinite;
  }
  @keyframes brandGlow{
    0%,100%{box-shadow:0 6px 16px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.28);}
    50%{box-shadow:0 6px 22px rgba(6,182,212,.55),inset 0 1px 0 rgba(255,255,255,.28);}
  }
  .brand-text{min-width:0;padding-top:1px;}
  .brand-name{font-size:13px;font-weight:700;line-height:1.45;letter-spacing:.1px;}
  .brand-sub{font-size:9px;color:#7ea6d0;letter-spacing:.6px;margin-top:3px;text-transform:uppercase;line-height:1.45;}

  .nav-label{
    font-size:10px;color:#5f86b3;letter-spacing:1.3px;text-transform:uppercase;
    padding:5px 12px 6px;font-weight:600;
  }
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 11px;border-radius:9px;position:relative;
    color:#a9c4de;text-decoration:none;font-size:12.5px;font-weight:500;
    transition:background .18s,color .18s,transform .18s,box-shadow .18s;
  }
  .nav-item svg{flex:none;opacity:.9;transition:transform .18s;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px);}
  .nav-item:hover svg{transform:scale(1.08);}
  .nav-item.active{
    background:linear-gradient(90deg,rgba(37,99,235,.96),rgba(59,130,246,.45) 75%,rgba(59,130,246,.18));
    color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.34),inset 0 1px 0 rgba(255,255,255,.14);
  }
  .nav-item.active::before{
    content:"";position:absolute;left:-13px;top:8px;bottom:8px;width:3px;
    border-radius:0 3px 3px 0;background:linear-gradient(180deg,#67e8f9,#60a5fa);
    box-shadow:0 0 8px rgba(96,165,250,.8);
  }
  .nav-badge{
    margin-left:auto;font-size:9.5px;font-weight:600;line-height:1.7;
    background:rgba(255,255,255,.12);color:#cfe3f8;
    padding:0 6px;border-radius:999px;min-width:20px;text-align:center;
  }
  .nav-item.active .nav-badge{background:rgba(255,255,255,.24);color:#fff;}

  .sidebar-foot{margin-top:auto;padding-top:16px;}
  .status-card{
    display:flex;align-items:center;gap:9px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
    border-radius:10px;padding:8px 10px;margin-bottom:9px;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15);
  }
  .status-dot.online{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.16);}
  .status-dot.offline{background:#f43f5e;box-shadow:0 0 0 3px rgba(244,63,94,.16);}
  .status-card b{display:block;font-size:11px;font-weight:600;color:#e2eefb;line-height:1.45;}
  .status-card small{display:block;font-size:9.5px;color:#7ea6d0;line-height:1.45;}
  .side-foot{font-size:9.5px;color:#5f86b3;text-align:center;letter-spacing:.3px;}

  /* ================= Main ================= */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;}
  .topbar{
    flex:none;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    box-shadow:0 2px 12px rgba(15,23,42,.05);z-index:10;
  }
  .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .menu-btn{
    display:none;width:36px;height:36px;border:1px solid var(--line);background:#fff;
    border-radius:9px;cursor:pointer;color:#475569;align-items:center;justify-content:center;
  }
  .menu-btn:hover{background:#f8fafc;}
  .heading{min-width:0;}
  .breadcrumb{
    display:flex;align-items:center;gap:6px;font-size:11.5px;color:#94a3b8;line-height:1.5;
  }
  .breadcrumb a{color:#64748b;text-decoration:none;}
  .breadcrumb a:hover{color:var(--primary);}
  .breadcrumb .current{color:#334155;font-weight:600;}
  .breadcrumb svg{color:#cbd5e1;flex:none;}
  .topbar h1{
    margin:1px 0 0;font-size:16.5px;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(120deg,#0f172a 35%,#1d4ed8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .topbar-right{display:flex;align-items:center;gap:9px;flex:none;}
  .status-chip{
    display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;
    border-radius:999px;font-size:11.5px;font-weight:600;
    background:#fffbeb;color:#b45309;border:1px solid #fde68a;white-space:nowrap;
  }
  .status-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-chip.online{background:#ecfdf5;color:#0f766e;border-color:#ccfbf1;}
  .status-chip.offline{background:#fff1f2;color:#be123c;border-color:#fecdd3;}
  .lang-switch{
    display:flex;align-items:center;gap:6px;height:34px;padding:0 9px;
    border:1px solid var(--line);border-radius:9px;background:#fff;color:#64748b;
    transition:border-color .16s,box-shadow .16s;
  }
  .lang-switch:hover{border-color:#93b4fd;box-shadow:0 2px 8px rgba(37,99,235,.12);}
  .lang-switch:focus-within{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .lang-switch svg{flex:none;color:#64748b;}
  .lang-switch select{
    border:none;outline:none;background:transparent;font-family:inherit;
    font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;
    appearance:none;padding-right:12px;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right center;
  }
  .lang-switch select option{color:#0f172a;background:#fff;}

  .content{flex:1;min-height:0;position:relative;background:var(--bg);}
  .view{position:absolute;inset:0;display:none;}
  .view.active{display:block;animation:viewIn .28s ease;}
  @keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .view iframe{width:100%;height:100%;border:0;display:block;background:var(--bg);}

  .backdrop{
    display:none;position:fixed;inset:0;background:rgba(8,24,43,.45);z-index:25;
    backdrop-filter:blur(1px);
  }

  @media (max-width: 980px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;
      transform:translateX(-100%);transition:transform .22s ease;
    }
    .sidebar.open{transform:none;}
    .backdrop.show{display:block;}
    .menu-btn{display:flex;}
    .topbar{padding:11px 15px;gap:10px;}
    .status-chip{display:none;}
    .topbar h1{font-size:15px;}
  }
  @media (max-width: 560px){
    .lang-switch{padding:0 7px;}
    .lang-switch select{font-size:11.5px;}
    .topbar-right{gap:6px;}
  }
</style>
</head>

    },
    vi: {

      sideOffline: "Hãy chạy rag_server.py",
      docTitle: "Nền tảng dịch vụ ngôn ngữ khẩn cấp về tâm lý ứng phó thảm họa xuyên biên giới ASEAN"
    },
    ms: {
      brandTitle: "Platform Perkhidmatan Bahasa Kecemasan Psikososial Bencana Rentas Sempadan ASEAN",
      brandSub: "PLATFORM PERKHIDMATAN BAHASA KECEMASAN",
      navLabel: "Ruang kerja",
      navDashboard: "Gambaran Platform",
      navForeign: "Berita Asing",
      navTranslate: "Terjemahan Pelbagai Bahasa",
      navGlossary: "Pengurusan Istilah",
      navParallel: "Korpus Selari",
      navCms: "Pengurusan Berita CMS",
      navRag: "Soal Jawab RAG",
      crumbHome: "Laman utama",
      sideFoot: "Prototaip kursus · Projek latihan",
      titles: {
        dashboard: "Gambaran Platform",
        foreign: "Agregasi Berita Asing",
        translate: "Terjemahan Pelbagai Bahasa",
        glossary: "Pengurusan Istilah",
        parallel: "Pengurusan Korpus Selari",
        cms: "Pengurusan Berita CMS",
        rag: "Soal Jawab RAG"
      },
      statusChecking: "Menyemak perkhidmatan…",
      serviceOnline: "Dalam talian",
      serviceDemo: "Dalam talian · Mod demo",
      serviceOffline: "Perkhidmatan tidak disambung",
      sideOnline: "Bigmodel + DeepSeek sedia",
      sideDemo: "Mod demo · carian setempat",
      sideOffline: "Jalankan rag_server.py",
      docTitle: "Platform Perkhidmatan Bahasa Kecemasan Psikososial Bencana Rentas Sempadan ASEAN"
    }
  };

  var VIEWS = {
    dashboard: "overview.html?embed=1",
    foreign: "foreign.html?embed=1",
    translate: "translate.html?embed=1",
    glossary: "glossary.html?embed=1",
    parallel: "parallel.html?embed=1",
    cms: "cms.html?embed=1",
    rag: "rag.html?embed=1"
  };

  var lang = (function () {
    try {
      var value = localStorage.getItem(LANG_KEY);
      return CODES.indexOf(value) >= 0 ? value : "zh";
    } catch (e) { return "zh"; }
  })();
  var currentView = "dashboard";
  var serviceState = "checking";

  function t(key) { return (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key; }

  /* ---------- 路由 ---------- */
  function parseView() {
    var raw = location.hash.replace(/^#\/?/, "").split("?")[0];
    return VIEWS[raw] ? raw : "dashboard";
  }

  function ensureFrame(view) {
    var panel = document.querySelector('[data-panel="' + view + '"]');
    if (!panel) return;
    var frame = panel.querySelector("iframe");
    if (frame && !frame.getAttribute("src")) {
      frame.src = frame.getAttribute("data-src");
    }
  }

  function setView(view) {
    currentView = view;
    ensureFrame(view);
    Array.prototype.forEach.call(document.querySelectorAll(".view"), function (panel) {
      panel.classList.toggle("active", panel.getAttribute("data-panel") === view);
    });
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (item) {
      item.classList.toggle("active", item.getAttribute("data-view") === view);
    });
    renderChrome();
    closeSidebar();
  }

  function renderChrome() {
    var title = (I18N[lang].titles[currentView]) || "";
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("crumbCurrent").textContent = title;
    document.title = I18N[lang].docTitle + " · " + title;
  }

  /* ---------- 语言 ---------- */
  function applyLang(next, broadcast) {
    lang = CODES.indexOf(next) >= 0 ? next : "zh";
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    document.getElementById("langSelect").value = lang;

    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    renderChrome();
    renderServiceState();

    if (broadcast !== false) {
      Array.prototype.forEach.call(document.querySelectorAll(".view iframe"), function (frame) {
        try {
          frame.contentWindow.postMessage({ type: "setLang", lang: lang }, "*");
        } catch (e) { /* iframe 尚未加载 */ }
      });
    }
  }

  /* ---------- 服务状态 ---------- */
  function renderServiceState() {
    var chip = document.getElementById("statusChip");
    var chipText = document.getElementById("statusChipText");
    var dot = document.getElementById("sideDot");
    var title = document.getElementById("sideStatusTitle");
    var sub = document.getElementById("sideStatusSub");

    chip.className = "status-chip";
    dot.className = "status-dot";

    if (serviceState === "online") {
      chipText.textContent = t("serviceOnline");
      title.textContent = t("serviceOnline");
      sub.textContent = t("sideOnline");
      dot.classList.add("online");
      chip.classList.add("online");
    } else if (serviceState === "demo") {
      chipText.textContent = t("serviceDemo");
      title.textContent = t("serviceOnline");
      sub.textContent = t("sideDemo");
      dot.classList.add("online");
    } else if (serviceState === "offline") {
      chipText.textContent = t("serviceOffline");
      title.textContent = t("serviceOffline");
      sub.textContent = t("sideOffline");
      dot.classList.add("offline");
      chip.classList.add("offline");
    } else {
      chipText.textContent = t("statusChecking");
      title.textContent = t("statusChecking");
      sub.textContent = "API";
    }
  }

  function checkService() {
    fetch("/api/status", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (info) {
        serviceState = (info.embedding_mode === "bigmodel" && info.llm_mode === "deepseek") ? "online" : "demo";
        renderServiceState();
        setBadge("rag", info.chunk_count || "AI");
        setBadge("foreign", info.foreign_count || 0);
        setBadge("glossary", info.glossary_count || 0);
        setBadge("parallel", info.parallel_count || 0);
      })
      .catch(function () {
        serviceState = "offline";
        renderServiceState();
      });
  }

  function setBadge(name, value) {
    var badge = document.querySelector('[data-badge="' + name + '"]');
    if (badge && value) badge.textContent = value;
  }

  /* ---------- 侧栏计数 ---------- */
  function loadCounts() {
    fetch("glossary.json", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var list = Array.isArray(data) ? data : (data && data.terms) || [];
        setBadge("glossary", list.length);
      })
      .catch(function () {});

    fetch("parallel.json", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (Array.isArray(data)) setBadge("parallel", data.length);
      })
      .catch(function () {});

    fetch("foreign_news.json", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (Array.isArray(data)) setBadge("foreign", data.length);
      })
      .catch(function () {});

    try {
      var raw = localStorage.getItem("asean_insarag_news_cms_v1");
      var list = raw ? JSON.parse(raw) : null;
      if (Array.isArray(list) && list.length) {
        setBadge("cms", list.length);
        return;
      }
    } catch (e) { /* ignore */ }

    fetch("insarag_news.json", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (Array.isArray(data)) setBadge("cms", data.length);
      })
      .catch(function () {});
  }

  /* ---------- 移动端侧栏 ---------- */
  function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("backdrop").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("backdrop").classList.remove("show");
  }

  /* ---------- 事件 ---------- */
  document.getElementById("menuBtn").addEventListener("click", openSidebar);
  document.getElementById("backdrop").addEventListener("click", closeSidebar);
  document.getElementById("langSelect").addEventListener("change", function (e) {
    applyLang(e.target.value, true);
  });
  window.addEventListener("hashchange", function () {
    setView(parseView());
  });
  window.addEventListener("storage", function (e) {
    if (e.key === LANG_KEY && e.newValue && e.newValue !== lang) {
      applyLang(e.newValue, false);
    }
  });
  window.addEventListener("message", function (e) {
    if (!e.data) return;
    if (e.data.type === "navigate" && VIEWS[e.data.view]) {
      location.hash = "#/" + e.data.view;
    } else if (e.data.type === "setLang" && CODES.indexOf(e.data.lang) >= 0) {
      if (e.data.lang !== lang) applyLang(e.data.lang, true);
    } else if (e.data.type === "reload-counts") {
      loadCounts();
    }
  });

  /* ---------- 初始化 ---------- */
  if (!location.hash) location.hash = "#/dashboard";
  applyLang(lang, true);
  setView(parseView());
  checkService();
  loadCounts();
})();
</script>
