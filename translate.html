<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多语种翻译 · 东盟灾害心理干预应急语言服务平台</title>
<link rel="stylesheet" href="assets/kb.css">
<style>
  .trans-grid{display:grid;grid-template-columns:1fr 34px 1fr;gap:12px;align-items:stretch;}
  .trans-col{display:flex;flex-direction:column;min-width:0;}
  .trans-col textarea{
    width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-family:inherit;font-size:13.5px;line-height:1.85;color:var(--text);
    background:#fbfcfe;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .trans-col textarea:focus{border-color:#93b4fd;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .trans-col textarea[readonly]{background:#f8fafc;color:#1e293b;}
  .col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
  .col-head .lbl{font-size:11.5px;font-weight:600;color:#94a3b8;letter-spacing:.4px;text-transform:uppercase;}
  .swap-col{display:flex;align-items:center;justify-content:center;}
  .swap-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
    color:var(--primary);cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);transition:border-color .15s,background .15s;
  }
  .swap-btn:hover{border-color:#93b4fd;background:var(--primary-soft);}
  .trans-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .counter{font-size:11px;color:#a3aec2;margin-left:auto;}
  .result-status{font-size:11.5px;color:#94a3b8;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .hl-preview{
    margin-top:8px;padding:10px 12px;border:1px dashed #e2e8f0;border-radius:10px;
    background:#fbfcfe;font-size:12.5px;line-height:1.85;color:#334155;max-height:130px;overflow:auto;
  }
  .hl-preview b{display:block;font-size:10.5px;color:#94a3b8;letter-spacing:.4px;margin-bottom:3px;font-weight:600;text-transform:uppercase;}
  mark{background:#fff3bf;color:#92400e;border-radius:3px;padding:0 2px;font-weight:600;}
  .term-list{display:flex;flex-direction:column;}
  .term-row{
    display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid #eef2f8;flex-wrap:wrap;
  }
  .term-row:last-child{border-bottom:none;}
  .term-row .pair{font-size:12.5px;color:#0f172a;font-weight:600;}
  .term-row .arrow{color:#cbd5e1;}
  .ref-card{padding:11px 18px;border-bottom:1px solid #eef2f8;}
  .ref-card:last-child{border-bottom:none;}
  .ref-card .src{font-size:12.5px;color:#334155;line-height:1.7;}
  .ref-card .tgt{font-size:12.5px;color:#1d4ed8;line-height:1.7;margin-top:3px;}
  .ref-card .meta{font-size:11px;color:#94a3b8;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
  .side-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .rag-bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:9px 12px;
    border:1px solid #bfdbfe;border-radius:10px;
    background:linear-gradient(90deg,#eff6ff,#f8fbff 70%,#ffffff);
  }
  .rag-title{font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:.5px;text-transform:uppercase;}
  .rag-pill{
    font-size:11.5px;font-weight:600;color:#1e3a8a;background:#fff;
    border:1px solid #dbeafe;border-radius:999px;padding:2px 10px;
  }
  .rag-pill b{color:#1d4ed8;}
  .hist-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px;}
  .hist-time{font-size:11px;color:#94a3b8;margin-left:auto;}
  @media (max-width:900px){
    .trans-grid{grid-template-columns:1fr;}
    .swap-col{transform:rotate(90deg);}
    .side-grid{grid-template-columns:1fr;}
  }
</style>

<body>
<script src="assets/api-config.js"></script>
<script src="assets/static-api.js"></script>
<div class="wrap">
  <div class="page-head">
    <div>
      <h1 data-i18n="title">多语种翻译</h1>
      <p data-i18n="desc">面向灾后心理干预场景，支持中文、英语、泰语、越南语、马来语双向互译；翻译时自动命中 PFA 心理急救、创伤应激、哀伤辅导等术语标准译法，并检索心理安抚平行语料向量库获取双语上下文辅助生成。</p>
    </div>
    <span class="demo-tag" data-i18n="demoTag">演示模拟数据</span>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 data-i18n="panelTitle">双向翻译工作台</h2>
      <span class="sub" id="engineLabel">DeepSeek · Bigmodel</span>
    </div>
    <div class="panel-body">
      <div class="rag-bar hidden" id="ragBar"></div>
      <div class="trans-grid">
        <div class="trans-col">
          <div class="col-head">
            <span class="lbl" data-i18n="sourceLabel">原文</span>
            <select class="select" id="sourceSelect" style="height:31px;font-size:12px;"></select>
          </div>
          <textarea id="sourceText" data-i18n-placeholder="sourcePlaceholder" placeholder="请输入心理干预文本，例如：请对受灾家庭开展心理急救和需求评估…"></textarea>
          <div class="col-head" style="margin-top:8px;">
            <span class="counter" id="sourceCount">0 / 2000</span>
          </div>
        </div>

        <div class="swap-col">
          <button class="swap-btn" id="swapBtn" data-i18n-title="swap" title="交换语言">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
          </button>
        </div>

        <div class="trans-col">
          <div class="col-head">
            <span class="lbl" data-i18n="targetLabel">译文</span>
            <select class="select" id="targetSelect" style="height:31px;font-size:12px;"></select>
          </div>
          <textarea id="targetText" readonly placeholder=""></textarea>
          <div class="result-status" id="resultStatus"></div>
        </div>
      </div>

      <div class="trans-actions">
        <button class="btn btn-primary" id="btnTranslate" data-i18n="translateBtn">开始翻译</button>
        <button class="btn btn-outline" id="btnCopy" data-i18n="copyBtn">复制译文</button>
        <button class="btn btn-outline" id="btnSpeak" data-i18n="speakBtn">播报译文</button>
        <button class="btn btn-outline" id="btnMic" data-i18n="micBtn">语音输入</button>
        <button class="btn btn-outline" id="btnClear" data-i18n="clearBtn">清空</button>
        <span class="counter" data-i18n="hint">Ctrl + Enter 快速翻译</span>
      </div>
      <div class="notice hidden" id="notice"></div>

      <div class="hl-preview hidden" id="sourcePreview"><b data-i18n="sourcePreviewLabel">原文术语命中</b><div id="sourcePreviewText"></div></div>
      <div class="hl-preview hidden" id="targetPreview"><b data-i18n="targetPreviewLabel">译文术语命中</b><div id="targetPreviewText"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
        <h2 data-i18n="historyTitle">翻译历史</h2>
        <span class="sub" data-i18n="historyHint">最近 10 条 · 点击回填</span>
      </div>
      <button class="btn btn-outline btn-sm" id="btnClearHistory" data-i18n="historyClear">清空历史</button>
    </div>
    <div class="list" id="historyList"></div>
  </div>

  <div class="side-grid">
    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="glossaryTitle">术语库命中</h2>
        <span class="sub" id="glossaryCount">0</span>
      </div>
      <div class="term-list" id="glossaryList">
        <div class="empty" data-i18n="glossaryEmpty">本次翻译未命中术语库条目</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="parallelTitle">平行语料参考</h2>
        <span class="sub" id="parallelCount">0</span>
      </div>
      <div id="parallelList">
        <div class="empty" data-i18n="parallelEmpty">未检索到相关平行语料</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 data-i18n="newsTitle">相关新闻来源</h2>
        <span class="sub" id="newsCount">0</span>
      </div>
      <div id="newsList">
        <div class="empty" data-i18n="newsEmpty">未匹配到相关新闻</div>
      </div>
    </div>
  </div>
</div>

  /* ---------- 特色功能：翻译历史（localStorage） ---------- */
  var HISTORY_KEY = "kb_translate_history";
  var HISTORY_MAX = 10;

  function readHistory() {
    try {
      var list = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function writeHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
  }

  function formatTime(ts) {
    var d = new Date(ts || Date.now());
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function pushHistory(entry) {
    var list = readHistory().filter(function (item) {
      return !(item.text === entry.text && item.source === entry.source && item.target === entry.target);
    });
    list.unshift(entry);
    writeHistory(list.slice(0, HISTORY_MAX));
    renderHistory();
  }

  function renderHistory() {
    var node = document.getElementById("historyList");
    var list = readHistory();
    document.getElementById("btnClearHistory").disabled = !list.length;
    if (!list.length) {
      node.innerHTML = '<div class="empty">' + KB.escapeHtml(t("historyEmpty")) + "</div>";
      return;
    }
    node.innerHTML = list.map(function (item, i) {
      return '<div class="row" data-index="' + i + '" role="button" tabindex="0">' +
        '<div class="row-main">' +
          '<div class="hist-head">' +
            '<span class="tag blue">' + KB.escapeHtml(KB.langLabel(item.source)) + " → " +
              KB.escapeHtml(KB.langLabel(item.target)) + "</span>" +
            '<span class="hist-time">' + KB.escapeHtml(formatTime(item.ts)) + "</span>" +
          "</div>" +
          '<div class="row-title">' + KB.escapeHtml(KB.truncate(item.text, 80)) + "</div>" +
          '<div class="row-summary">' + KB.escapeHtml(KB.truncate(item.translation, 110)) + "</div>" +
        "</div>" +
      "</div>";
    }).join("");
    Array.prototype.forEach.call(node.querySelectorAll(".row"), function (row) {
      row.addEventListener("click", function () {
        restoreHistory(list[parseInt(row.getAttribute("data-index"), 10)]);
      });
    });
  }

  function restoreHistory(item) {
    if (!item) return;
    document.getElementById("sourceSelect").value = item.source;

    resetResult();
    applyLang(lang);

    KB.toast(t("historyRestored"));

  function fillLangSelects() {
    var source = document.getElementById("sourceSelect");

    var options = KB.LANGS.map(function (item) {
      return '<option value="' + item.code + '">' + KB.escapeHtml(item.label) + "</option>";
    }).join("");
    source.innerHTML = options;
    target.innerHTML = options;
    source.value = sourceValue;
    target.value = targetValue === sourceValue ? (sourceValue === "zh" ? "en" : "zh") : targetValue;

  function buildPreview(container, textNode, text, hits, field) {
    if (!hits.length) {
      container.classList.add("hidden");
      return;
    }
    container.classList.remove("hidden");
    if (!text) {
      textNode.innerHTML = KB.escapeHtml(text || "");
      return;
    }
    var spans = [];
    if (field === "source") {
      hits.forEach(function (hit) {
        spans.push({ start: hit.position, end: hit.position + hit.length });
      });
    } else {
      var lower = text.toLowerCase();
      hits.forEach(function (hit) {
        var term = String(hit.target_term || "");
        if (!term) return;
        var at = lower.indexOf(term.toLowerCase());
        if (at >= 0) spans.push({ start: at, end: at + term.length });
      });
    }
    spans.sort(function (a, b) { return a.start - b.start; });
    var out = "";
    var cursor = 0;
    spans.forEach(function (span) {
      if (span.start < cursor) return;
      out += KB.escapeHtml(text.slice(cursor, span.start));
      out += "<mark>" + KB.escapeHtml(text.slice(span.start, span.end)) + "</mark>";
      cursor = span.end;
    });
    out += KB.escapeHtml(text.slice(cursor));
    textNode.innerHTML = out;
  }

  function renderResult(result) {
    lastResult = result;
    renderRagBar(result);
    var matches = result.matches || [];
    var references = result.references || [];
    var newsSources = result.news_sources || [];
    var translation = result.translation || "";
    document.getElementById("targetText").value = translation;

    var meta = KB.fillTpl(t("resultMeta"), {
      mode: result.mode === "deepseek" ? t("modeDeepseek") : t("modeDemo"),
      ms: result.elapsed_ms || 0,
      g: matches.length,
      p: references.length
    });
    document.getElementById("resultStatus").innerHTML =
      '<span class="tag green">' + KB.escapeHtml(result.model || "") + "</span>" +
      "<span>" + KB.escapeHtml(meta) + "</span>";

    buildPreview(document.getElementById("sourcePreview"), document.getElementById("sourcePreviewText"),
      document.getElementById("sourceText").value, matches, "source");
    buildPreview(document.getElementById("targetPreview"), document.getElementById("targetPreviewText"),
      translation, matches, "target");

    document.getElementById("glossaryCount").textContent = matches.length;
    document.getElementById("glossaryList").innerHTML = matches.length
      ? matches.map(function (hit) {
          return '<div class="term-row">' +
            '<span class="pair">' + KB.escapeHtml(hit.source_term) + "</span>" +
            '<span class="arrow">→</span>' +
            '<span class="pair">' + KB.escapeHtml(hit.target_term) + "</span>" +
            '<span class="tag blue">' + KB.escapeHtml(hit.domain || "") + "</span>" +
            '<span class="tag ' + (hit.review_status === "已审核" ? "green" : "amber") + '">' +
              KB.escapeHtml(hit.review_status === "已审核" ? t("reviewApproved") : t("reviewPending")) + "</span>" +
          "</div>";

      : '<div class="empty">' + KB.escapeHtml(t("glossaryEmpty")) + "</div>";

    document.getElementById("parallelCount").textContent = references.length;

      ? references.map(function (ref) {
          return '<div class="ref-card">' +
            '<div class="src">' + KB.escapeHtml(ref.source_text) + "</div>" +

            '<div class="meta">' +

              "<span>" + KB.escapeHtml(ref.domain || "") + "</span>" +
              "<span>" + KB.escapeHtml(KB.fillTpl(t("scoreLabel"), { p: ((ref.score || 0) * 100).toFixed(1) })) + "</span>" +
              "<span>" + KB.escapeHtml(ref.source || "") + "</span>" +
            "</div>" +
          "</div>";
        }).join("")
      : '<div class="empty">' + KB.escapeHtml(t("parallelEmpty")) + "</div>";

    document.getElementById("newsCount").textContent = newsSources.length;
    document.getElementById("newsList").innerHTML = newsSources.length
      ? newsSources.map(function (item) {
          return '<div class="ref-card">' +
            '<div class="src">' + KB.escapeHtml(item.title || "") + "</div>" +
            '<div class="tgt">' + KB.escapeHtml(item.summary || "") + "</div>" +
            '<div class="meta">' +
              '<span class="tag ' + (item.type === "foreign" ? "green" : "blue") + '">' + KB.escapeHtml(item.keyword || "") + "</span>" +
              "<span>" + KB.escapeHtml(item.source_name || "") + "</span>" +
              "<span>" + KB.escapeHtml(item.publish_date || "") + "</span>" +
              (item.url ? '<a href="' + KB.escapeHtml(item.url) + '" target="_blank" rel="noopener noreferrer">' + KB.escapeHtml(t("newsLink")) + "</a>" : "") +
            "</div>" +
          "</div>";
        }).join("")
      : '<div class="empty">' + KB.escapeHtml(t("newsEmpty")) + "</div>";

    if (result.notice) {
      setNotice(result.notice, "info");

    }

    lastResult = null;
    hideRagBar();
    document.getElementById("targetText").value = "";

    document.getElementById("glossaryCount").textContent = "0";

    document.getElementById("parallelCount").textContent = "0";

    document.getElementById("sourcePreview").classList.add("hidden");
    document.getElementById("targetPreview").classList.add("hidden");

  function translate() {
    if (busy) return;
    var text = document.getElementById("sourceText").value.trim();
    var sourceLang = document.getElementById("sourceSelect").value;
    var targetLang = document.getElementById("targetSelect").value;
    if (!text) {
      KB.toast(t("emptyText"), "error");
      document.getElementById("sourceText").focus();
      return;
    }
    if (sourceLang === targetLang) {
      KB.toast(t("sameLang"), "error");
      return;
    }

    busy = true;
    var button = document.getElementById("btnTranslate");
    button.disabled = true;
    button.textContent = t("translatingBtn");
    setNotice(t("loading"), "info");
    hideRagBar();
    document.getElementById("resultStatus").innerHTML = '<span class="tag gray">…</span>';

    fetch("/api/translate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, source: sourceLang, target: targetLang })
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok || data.ok === false) throw new Error(data.error || ("HTTP " + res.status));
        return data;
      });
    }).then(function (data) {
      renderResult(data);
      pushHistory({
        source: sourceLang,
        target: targetLang,
        text: text,
        translation: data.translation || "",
        ts: Date.now()
      });
    }).catch(function (err) {
      setNotice(KB.fillTpl(t("failed"), { e: err.message || "" }), "error");
      document.getElementById("resultStatus").innerHTML = '<span class="tag amber">' + KB.escapeHtml(t("modeDemo")) + "</span>";
      KB.toast(KB.fillTpl(t("failed"), { e: err.message || "" }), "error");
    }).then(function () {
      busy = false;
      button.disabled = false;
      button.textContent = t("translateBtn");
    });
  }

  function copyTranslation() {
    var value = document.getElementById("targetText").value;
    if (!value) {
      KB.toast(t("copyEmpty"), "error");
      return;
    }
    function done() { KB.toast(t("copied")); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(done).catch(function () {
        var area = document.getElementById("targetText");
        area.removeAttribute("readonly");
        area.select();
        try { document.execCommand("copy"); done(); } catch (e) { KB.toast(t("copyFail"), "error"); }
        area.setAttribute("readonly", "readonly");
      });
    } else {
      var area = document.getElementById("targetText");
      area.removeAttribute("readonly");
      area.select();
      try { document.execCommand("copy"); done(); } catch (e) { KB.toast(t("copyFail"), "error"); }
      area.setAttribute("readonly", "readonly");
    }
  }

  function clearAll() {

    updateCount();
    resetResult();
    KB.toast(t("cleared"));

  /* ---------- 特色功能：语音播报与语音输入 ---------- */
  var VOICE_LOCALES = { zh: "zh-CN", en: "en-US", th: "th-TH", vi: "vi-VN", ms: "ms-MY" };
  var speaking = false;
  var recognizing = false;
  var recognizer = null;

  function speakResult() {
    if (!("speechSynthesis" in window)) { KB.toast(t("voiceUnsupported"), "error"); return; }
    if (speaking) {
      window.speechSynthesis.cancel();
      speaking = false;
      document.getElementById("btnSpeak").textContent = t("speakBtn");
      return;
    }
    var text = document.getElementById("targetText").value.trim();
    if (!text) { KB.toast(t("emptyText"), "error"); return; }
    var targetLang = document.getElementById("targetSelect").value;
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = VOICE_LOCALES[targetLang] || "zh-CN";
    utter.rate = 0.95;
    utter.onend = function () {
      speaking = false;
      document.getElementById("btnSpeak").textContent = t("speakBtn");
    };
    utter.onerror = utter.onend;
    speaking = true;
    document.getElementById("btnSpeak").textContent = t("speaking");
    window.speechSynthesis.speak(utter);
  }

  function startVoiceInput() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { KB.toast(t("voiceUnsupported"), "error"); return; }
    if (recognizing && recognizer) { recognizer.stop(); return; }
    recognizer = new SR();
    recognizer.lang = VOICE_LOCALES[document.getElementById("sourceSelect").value] || "zh-CN";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = function (e) {
      var text = e.results[0][0].transcript || "";
      if (text) {
        var area = document.getElementById("sourceText");
        area.value = area.value ? area.value + " " + text : text;
        updateCount();
      }
    };
    recognizer.onend = function () {
      recognizing = false;
      document.getElementById("btnMic").textContent = t("micBtn");
    };
    recognizer.onerror = recognizer.onend;
    recognizing = true;
    document.getElementById("btnMic").textContent = t("listening");
    try { recognizer.start(); } catch (e) { recognizer.onend(); }
  }

  function swapLangs() {
    var source = document.getElementById("sourceSelect");
    var target = document.getElementById("targetSelect");
    var temp = source.value;
    source.value = target.value;
    target.value = temp;
  }

  function applyLang(next) {
    lang = next;
    t = KB.makeT(T, lang);
    renderStatic();
    fillLangSelects();
    var sourceValue = document.getElementById("sourceSelect").value;
    document.getElementById("sourceText").placeholder = t("sourcePlaceholder");
    document.getElementById("btnTranslate").textContent = busy ? t("translatingBtn") : t("translateBtn");
    if (lastResult) {
      renderResult(lastResult);
    } else {
      resetResult();
    }
    document.getElementById("engineLabel").textContent = "DeepSeek · Bigmodel · " + KB.langLabel(sourceValue);
    renderHistory();
  }

  document.getElementById("btnClearHistory").addEventListener("click", clearHistory);
  document.getElementById("btnSpeak").addEventListener("click", speakResult);
  document.getElementById("btnMic").addEventListener("click", startVoiceInput);
  document.getElementById("swapBtn").addEventListener("click", swapLangs);
  document.getElementById("sourceText").addEventListener("input", updateCount);
  document.getElementById("sourceText").addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      translate();
    }
  });
  document.getElementById("sourceSelect").addEventListener("change", function () {
    var target = document.getElementById("targetSelect");
    if (target.value === this.value) {
      target.value = this.value === "zh" ? "en" : "zh";
    }
    applyLang(lang);
  });
  document.getElementById("targetSelect").addEventListener("change", function () {
    var source = document.getElementById("sourceSelect");
    if (source.value === this.value) {
      source.value = this.value === "zh" ? "en" : "zh";
    }
    applyLang(lang);
  });

  KB.bindLanguage(applyLang, { onVisible: true });
  fillLangSelects();
  applyLang(lang);
  updateCount();
})();
</script>
</body>
</html>
